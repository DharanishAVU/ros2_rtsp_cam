services:
  rtsp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtsp-camera
    restart: unless-stopped
    
    # Network mode for ROS2 DDS discovery
    network_mode: host
    runtime: nvidia
    
    privileged: true
    ipc: host
    group_add:
      - video

    # Expose all /dev entries (cameras, GPU, etc.) into the container
    volumes:
      - /dev/:/dev/
      # NVIDIA hw GStreamer plugins (nvvidconv, nvv4l2h264enc) bind-mounted from JetPack host
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/tegra-eglstream-libs:/usr/lib/aarch64-linux-gnu/tegra-eglstream-libs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    
    environment:
      # GStreamer settings
      - GST_DEBUG=2
      
      # Camera parameters (compatible with stream_simple.sh)
      - DEVICE=/dev/video-side-front
      - WIDTH=1920
      - HEIGHT=1080
      - FRAMERATE=60
      
      # ROS2 mode: set to 1 for combined RTSP+ROS2, 0 for RTSP-only
      - ROS2_ENABLED=1
      
      # ROS2 DDS configuration
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Unicast peer discovery — avoids multicast which is blocked on most WiFi/LAN setups
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface autodetermine="true"/></Interfaces></General><Discovery><Peers><Peer address="10.10.111.6"/></Peers></Discovery></Domain></CycloneDDS>
      
      # Python error handling for better diagnostics
      - PYTHONFAULTHANDLER=1
    
    shm_size: "256mb"