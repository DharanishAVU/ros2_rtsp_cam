services:
  rtsp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # r36.2.0 = JP6.0 (L4T R36.2.0) — guest-pullable from NGC, no auth required.
        # Base: nvcr.io/nvidia/l4t-jetpack (self-contained NVIDIA GStreamer plugins).
        # ABI-compatible with JP6.0 GA (r36.3.0) and JP6.1 (r36.4.0) hosts.
        # Check your host version with: cat /etc/nv_tegra_release
        L4T_TAG: r36.2.0
    container_name: rtsp-camera
    restart: unless-stopped
    
    # Network mode for ROS2 DDS discovery
    network_mode: host
    runtime: nvidia
    
    privileged: true
    ipc: host
    group_add:
      - video

    # Expose all /dev entries (cameras, GPU, etc.) into the container
    volumes:
      - /dev/:/dev/
      # JetPack 6: NVIDIA GStreamer plugins (nvv4l2decoder, nvvidconv, nvv4l2h264enc) are
      # baked into the l4t-jetpack base image — no host bind-mounts needed.
      # Container is self-contained and independent of host JetPack version.

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    
    environment:
      # GStreamer settings
      - GST_DEBUG=2
      
      # Camera parameters (compatible with stream_simple.sh)
      - DEVICE=/dev/video-side-front
      - WIDTH=1920
      - HEIGHT=1080
      - FRAMERATE=30
      - ROS_WIDTH=1920
      - ROS_HEIGHT=1080
      - ROS_FRAMERATE=30
      - RTSP_WIDTH=1280
      - RTSP_HEIGHT=720
      - RTSP_FRAMERATE=30
      - USE_HW_MJPEG_DECODER=1
      
      # ROS2 mode: set to 1 for combined RTSP+ROS2, 0 for RTSP-only
      - ROS2_ENABLED=1
      
      # ROS2 DDS configuration
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Unicast peer discovery — avoids multicast which is blocked on most WiFi/LAN setups
      # MaxMessageSize/FragmentSize raised for 1920×1080 image transport (~6 MB/frame)
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface autodetermine="true"/></Interfaces><MaxMessageSize>65500B</MaxMessageSize><FragmentSize>65000B</FragmentSize></General><Discovery><Peers><Peer address="192.168.1.52"/></Peers></Discovery></Domain></CycloneDDS>
      
      # Python error handling for better diagnostics
      - PYTHONFAULTHANDLER=1
    
    shm_size: "256mb"