services:
  rtsp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match your JetPack 6 version: r36.3.0 (JP6.0 GA) or r36.4.0 (JP6.1)
        L4T_TAG: r36.4.0
    container_name: rtsp-camera
    restart: unless-stopped
    
    # Network mode for ROS2 DDS discovery
    network_mode: host
    runtime: nvidia
    
    privileged: true
    ipc: host
    group_add:
      - video

    # Expose all /dev entries (cameras, GPU, etc.) into the container
    volumes:
      - /dev/:/dev/
      # JetPack 6: NVIDIA GStreamer plugins (nvv4l2decoder, nvvidconv, nvv4l2h264enc) are
      # installed inside the container via nvidia-l4t-gstreamer — no host bind-mounts needed.
      # (JP5 bind-mount approach broke in JP6 due to library path reorganisation in L4T R36.x)

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    
    environment:
      # GStreamer settings
      - GST_DEBUG=2
      
      # Camera parameters (compatible with stream_simple.sh)
      - DEVICE=/dev/video-side-front
      - WIDTH=1920
      - HEIGHT=1080
      - FRAMERATE=30
      - ROS_WIDTH=1920
      - ROS_HEIGHT=1080
      - ROS_FRAMERATE=30
      - RTSP_WIDTH=1280
      - RTSP_HEIGHT=720
      - RTSP_FRAMERATE=30
      - USE_HW_MJPEG_DECODER=1
      
      # ROS2 mode: set to 1 for combined RTSP+ROS2, 0 for RTSP-only
      - ROS2_ENABLED=1
      
      # ROS2 DDS configuration
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Unicast peer discovery — avoids multicast which is blocked on most WiFi/LAN setups
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface autodetermine="true"/></Interfaces></General><Discovery><Peers><Peer address="10.10.111.6"/></Peers></Discovery></Domain></CycloneDDS>
      
      # Python error handling for better diagnostics
      - PYTHONFAULTHANDLER=1
    
    shm_size: "256mb"